# Um serviço por empresa. Cada um tem o seu WhatsApp, a sua sessão e o seu id de empresa.
# Use: docker compose up -d --build
name: fluxa-chat

x-conector: &conector
  build:
    context: ..
    dockerfile: servidor/Dockerfile
  restart: always            # reinicia sozinho se cair ou se o servidor reiniciar
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  environment: &env-base
    GOOGLE_APPLICATION_CREDENTIALS: /segredos/conta-servico.json
    # IA supervisora: a chave fica no arquivo servidor/.env (fora do repositório). Sem chave, ela fica desligada.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - ./segredos/conta-servico.json:/segredos/conta-servico.json:ro

services:
  divinissima:
    <<: *conector
    container_name: fluxa-chat-divinissima
    environment:
      <<: *env-base
      EMPRESA_ID: uVqpWP9nssgfcPCh68uG2zebqA63
      PASTA_SESSAO: /dados/sessao
      ARQ_LID: /dados/lid-mapa.json
    volumes:
      - ./segredos/conta-servico.json:/segredos/conta-servico.json:ro
      - divinissima-dados:/dados

  carlafidelis:
    <<: *conector
    container_name: fluxa-chat-carlafidelis
    environment:
      <<: *env-base
      EMPRESA_ID: Kb5nOo3SK0dAi3SsHk20Y0Oa1aE3
      PASTA_SESSAO: /dados/sessao
      ARQ_LID: /dados/lid-mapa.json
    volumes:
      - ./segredos/conta-servico.json:/segredos/conta-servico.json:ro
      - carlafidelis-dados:/dados

  amandabernardes:
    <<: *conector
    container_name: fluxa-chat-amandabernardes
    environment:
      <<: *env-base
      EMPRESA_ID: JCsWyu3SALZxAzGU41oLnYYJJ5r2
      PASTA_SESSAO: /dados/sessao
      ARQ_LID: /dados/lid-mapa.json
    volumes:
      - ./segredos/conta-servico.json:/segredos/conta-servico.json:ro
      - amandabernardes-dados:/dados

volumes:
  divinissima-dados:
  carlafidelis-dados:
  amandabernardes-dados:
